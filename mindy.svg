<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130">
  <!-- Mindy, the MindVsYou chat buddy. Use with: <svg viewBox="0 0 130 130"><use href="mindy.svg#wave"/></svg>
       Poses: #face (head only, for avatars), #wave, #think, #cheer, #hint -->
  <style>
    .mindy-eyes { transform-box: fill-box; transform-origin: center; animation: mindy-blink 4.6s infinite; }
    .mindy-hand { transform-origin: 84px 108px; animation: mindy-wave 1.6s ease-in-out infinite; }
    .mindy-pop { transform-box: fill-box; transform-origin: center; animation: mindy-pop 1.8s ease-in-out infinite; }
    @keyframes mindy-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes mindy-wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-16deg); } }
    @keyframes mindy-pop { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.7); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <!-- head, screen and antenna shared by every pose -->
    <g id="m-head">
      <line x1="60" y1="27" x2="60" y2="13" stroke="#0D1B2A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="60" cy="10" r="6.5" fill="#FF6B2B" stroke="#fff" stroke-width="2.5"/>
      <rect x="8" y="52" width="11" height="24" rx="5.5" fill="#0D1B2A"/>
      <rect x="101" y="52" width="11" height="24" rx="5.5" fill="#0D1B2A"/>
      <rect x="16" y="26" width="88" height="78" rx="28" fill="#25D366" stroke="#fff" stroke-width="4"/>
      <rect x="26" y="38" width="68" height="50" rx="20" fill="#0D1B2A"/>
      <circle cx="36" cy="76" r="5" fill="#FF6B2B" opacity=".4"/>
      <circle cx="84" cy="76" r="5" fill="#FF6B2B" opacity=".4"/>
    </g>
    <g id="m-body">
      <rect x="37" y="98" width="46" height="26" rx="13" fill="#1AAE54" stroke="#fff" stroke-width="3"/>
      <circle cx="60" cy="112" r="4" fill="#fff" opacity=".85"/>
    </g>
    <g id="m-eyes"><circle cx="46" cy="58" r="6" fill="#fff"/><circle cx="74" cy="58" r="6" fill="#fff"/></g>
    <path id="m-smile" d="M48 72 Q60 82 72 72" stroke="#25D366" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path id="m-spark" d="M0-7 L2-2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2-2Z" fill="#FF6B2B"/>

  <!-- face only: for round avatars -->
  <g id="face">
    <use href="#m-head"/>
    <g class="mindy-eyes"><use href="#m-eyes"/></g>
    <use href="#m-smile"/>
  </g>

  <!-- wave: greeting -->
  <g id="wave">
    <path d="M36 108 Q26 112 22 121" stroke="#1AAE54" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="21" cy="122" r="6" fill="#fff"/>
    <use href="#m-body"/>
    <use href="#m-head"/>
    <g class="mindy-eyes"><use href="#m-eyes"/></g>
    <use href="#m-smile"/>
    <g class="mindy-hand">
      <path d="M84 108 Q106 102 110 84" stroke="#1AAE54" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="111" cy="80" r="7" fill="#fff"/>
    </g>
  </g>

  <!-- think: working out a question -->
  <g id="think">
    <path d="M36 108 Q26 112 22 121" stroke="#1AAE54" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="21" cy="122" r="6" fill="#fff"/>
    <use href="#m-body"/>
    <path d="M84 108 Q100 104 92 92" stroke="#1AAE54" stroke-width="9" fill="none" stroke-linecap="round"/>
    <use href="#m-head"/>
    <circle cx="91" cy="90" r="6" fill="#fff"/>
    <g class="mindy-eyes">
      <circle cx="46" cy="58" r="7" fill="#fff"/><circle cx="74" cy="58" r="7" fill="#fff"/>
      <circle cx="49" cy="55" r="3.5" fill="#0D1B2A"/><circle cx="77" cy="55" r="3.5" fill="#0D1B2A"/>
    </g>
    <path d="M38 47 L54 45 M66 42 L82 46" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M54 74 L66 74" stroke="#25D366" stroke-width="4" stroke-linecap="round"/>
    <circle cx="108" cy="30" r="3" fill="#0D1B2A" opacity=".55"/>
    <circle cx="114" cy="22" r="4" fill="#0D1B2A" opacity=".55"/>
    <rect x="98" y="0" width="30" height="17" rx="8.5" fill="#fff" stroke="#0D1B2A" stroke-width="2"/>
    <circle cx="106" cy="8.5" r="2" fill="#0D1B2A"/><circle cx="113" cy="8.5" r="2" fill="#0D1B2A"/><circle cx="120" cy="8.5" r="2" fill="#0D1B2A"/>
  </g>

  <!-- cheer: correct answer -->
  <g id="cheer">
    <path d="M38 106 Q16 102 11 80" stroke="#1AAE54" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M82 106 Q104 102 109 80" stroke="#1AAE54" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="10" cy="75" r="7" fill="#fff"/><circle cx="110" cy="75" r="7" fill="#fff"/>
    <use href="#m-body"/>
    <use href="#m-head"/>
    <g class="mindy-eyes">
      <path d="M38 62 Q46 49 54 62 M66 62 Q74 49 82 62" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M46 69 Q60 91 74 69 Z" fill="#fff"/>
    <path d="M54 79 Q60 74 66 79 Q60 86 54 79Z" fill="#FF6B2B"/>
    <use class="mindy-pop" href="#m-spark" x="20" y="22"/>
    <use class="mindy-pop" href="#m-spark" x="104" y="20"/>
    <circle cx="8" cy="50" r="2.5" fill="#FF6B2B"/><circle cx="122" cy="48" r="2.5" fill="#25D366"/>
  </g>

  <!-- hint: a missed question comes back -->
  <g id="hint">
    <path d="M36 108 Q26 112 22 121" stroke="#1AAE54" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M84 108 Q94 112 98 121" stroke="#1AAE54" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="21" cy="122" r="6" fill="#fff"/><circle cx="99" cy="122" r="6" fill="#fff"/>
    <use href="#m-body"/>
    <use href="#m-head"/>
    <g class="mindy-eyes"><use href="#m-eyes"/></g>
    <path d="M38 50 L53 46 M67 46 L82 50" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M50 72 Q60 79 70 72" stroke="#25D366" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="108" cy="24" r="15" fill="#FF6B2B" stroke="#fff" stroke-width="3"/>
    <path d="M101 25 A7.5 7.5 0 1 1 105 31" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M97 21 L101.5 27.5 L106 20.5Z" fill="#fff"/>
  </g>
  </defs>
</svg>
